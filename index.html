<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SHIFT Recruitment Technology</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b1118;
      color: #ffffff;
      font-family: Arial, sans-serif;
    }

    .hero {
      text-align: center;
      padding: 40px;
    }

    h1 {
      font-size: 64px;
      letter-spacing: 8px;
      margin-bottom: 16px;
    }

    .tagline {
      color: #aeb8c4;
      font-size: 22px;
      margin-bottom: 35px;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    a {
      display: inline-block;
      padding: 14px 24px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
    }

    .candidate {
      background: #ffffff;
      color: #0b1118;
    }

    .agency {
      border: 1px solid #697786;
      color: #ffffff;
    }
  </style>
</head>

<body>

  <main class="hero">

    <h1>SHIFT</h1>

    <p class="tagline">
      Recruitment Infrastructure Built For Trust.
    </p>

    <div class="buttons">
      <a class="candidate" href="#">
        Create Your Career Passport
      </a>

      <a class="agency" href="#">
        For Recruitment Agencies
      </a>
    </div>

  </main>

</body>
</html>
